# 将 index.html 部署到 GitHub Pages
# 推送代码到 main 分支时自动触发
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # 如果不想将所有文件都部署，可以用 exclusion 排除不需要的文件
          # 例如排除 .github、.gitignore、*.sh、*.md、worker.js 等
          # 但是默认部署全部也可以，因为用户只会通过浏览器访问 index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# 部署完成后，访问地址为:
# https://<你的用户名>.github.io/<仓库名>/
#
# 可选：自定义域名
# 1. 在仓库 Settings → Pages → Custom domain 中填入你的域名
# 2. 在你的域名 DNS 解析中添加 CNAME 记录指向 <你的用户名>.github.io
# 3. 在项目根目录创建 CNAME 文件（内容为你的域名），或通过 Pages 设置自动生成
